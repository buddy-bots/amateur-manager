name: Ligadaten importieren
on:
  workflow_dispatch:
  push:
    branches: [umbau]
    paths: ['tools/import-ligen.mjs', 'data/nrw-*.json']
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: umbau
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/import-ligen.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
