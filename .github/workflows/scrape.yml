name: Ligadaten holen
on:
  workflow_dispatch:
  push:
    branches: [umbau]
    paths: ['tools/scrape-fussballde.mjs', 'data/.scrape-trigger']
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: umbau
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/scrape-fussballde.mjs
      - name: Daten speichern
        run: |
          git config user.name "amateur-manager-bot"
          git config user.email "bot@amateur-manager.de"
          git add data/
          git commit -m "Ligadaten von fussball.de aktualisiert" || echo "nichts zu tun"
          git pull --rebase origin umbau
          git push origin HEAD:umbau
      - name: In Datenbank übernehmen
        run: |
          SHA=$(git rev-parse HEAD)
          curl -sS -X POST "https://wnzrakcsfwxsckrucfan.supabase.co/functions/v1/game" \
            -H "apikey: sb_publishable_xlzCh6qzM_Ve2r9PpOe5Sg_TlzWswH1" -H "Content-Type: application/json" \
            -d "{\"op\":\"ligenImport\",\"ref\":\"$SHA\"}" | tee /tmp/imp.json
          grep -q '"status":"\(ok\|recent\)"' /tmp/imp.json
