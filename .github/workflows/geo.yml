name: Karte holen
on:
  push:
    branches: [umbau]
    paths: ['data/.geo-trigger']
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: umbau }
      - run: |
          curl -sSfL -o data/de-laender.geo.json https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/2_bundeslaender/4_niedrig.geo.json || curl -sSfL -o data/de-laender.geo.json https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/2_bundeslaender/3_mittel.geo.json
          ls -la data
          git config user.name "amateur-manager-bot"; git config user.email "bot@amateur-manager.de"
          git add data/de-laender.geo.json; git commit -m "Bundesländer-Karte (GeoJSON, isellsoap/deutschlandGeoJSON)" || true
          git pull --rebase origin umbau; git push origin HEAD:umbau
