name: Server-Funktionen deployen

on:
  push:
    branches: [main, umbau]
    paths:
      - 'supabase/functions/**'
      - 'src/engine/**'
      - 'tools/build-engine.mjs'
      - 'package.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wnzrakcsfwxsckrucfan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine bauen und testen
        run: |
          node tools/build-engine.mjs
          node tools/test-engine.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Funktion "game" deployen
        # Die Funktion prüft das Login selbst (auth.getUser), daher ohne Gateway-JWT-Prüfung,
        # damit CORS-Vorabanfragen (OPTIONS) durchgehen.
        run: supabase functions deploy game --project-ref "$PROJECT_REF" --no-verify-jwt
