name: Orte holen
on:
  push:
    branches: [umbau]
    paths: ['data/.orte-trigger', 'tools/make-orte.mjs']
permissions:
  contents: write
jobs:
  o:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: umbau }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          curl -sSfL -o /tmp/DE.zip https://download.geonames.org/export/zip/DE.zip
          unzip -o /tmp/DE.zip -d /tmp/geo
          node tools/make-orte.mjs /tmp/geo/DE.txt
          git config user.name "amateur-manager-bot"; git config user.email "bot@amateur-manager.de"
          git add data/orte-de.json; git commit -m "Orte mit Koordinaten (GeoNames, CC BY 4.0)" || true
          git pull --rebase origin umbau; git push origin HEAD:umbau
